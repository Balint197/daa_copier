_subdirectory: template

project_name:
  type: str
  help: What is your package's name?
  placeholder: My Package
  validator: >-
    {% if not project_name.strip() %}
    Invalid project name
    {% endif %}

project_description:
  type: str
  help: What does your package do in one sentence?
  placeholder: A Python package that reticulates splines.
  validator: >-
    {% if not project_description.strip() %}
    Invalid project description
    {% endif %}

project_url:
  type: str
  help: What is the URL of your project's repository?
  placeholder: https://github.com/user/package
  validator: >-
    {% if not project_url.startswith("https://") %}
    Invalid project URL
    {% endif %}

python_version:
  type: str
  help: What is the minimum Python version your package should support?
  default: "3.10"
  when: "{{ not with_databricks }}"

with_databricks:
  type: bool
  default: false
  help: Does this project use Databricks?

databricks_runtime:
  type: str
  default: "16.4"
  choices:
    - "15.4"
    - "16.4"
    - "17.3"
  when: "{{ with_databricks }}"
  help: Which Databricks Runtime version?

author_name:
  when: false
  default: "DAALAB"

project_name_kebab_case:
  when: false
  default: "{{ project_name | lower | replace(' ', '-') }}"

project_name_snake_case:
  when: false
  default: "{{ project_name | lower | replace(' ', '_') }}"

